name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test imports
        run: python -c "import optimizer_msba_v1_engine; import portfolio_returns_engine; import ui_style; print('All imports passed')"

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --extend-ignore=E501,W503
